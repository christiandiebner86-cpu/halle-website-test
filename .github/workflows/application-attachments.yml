name: Application attachments and contact cleanup
on:
  push:
    paths: ['.github/workflows/application-attachments.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<span class="role">Pflegedienstleitung</span>','',1)
          marker='<button class="btn submit" id="applicationSubmit" type="submit">Jetzt bewerben ✈</button>'
          fileinput='<div style="grid-column:1/-1;background:rgba(255,255,255,.1);padding:12px;border-radius:10px"><label for="appAttachment" style="display:block;font-weight:850;margin-bottom:7px">📎 Anlage hinzufügen (optional)</label><input id="appAttachment" type="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="background:#fff"><small style="display:block;margin-top:6px;color:#d9e8ef">PDF, Word, JPG oder PNG · max. 10 MB</small></div>'
          if marker not in s: raise SystemExit('Submit marker missing')
          s=s.replace(marker,fileinput+marker,1)
          old="const userMsg=document.getElementById('appMessage').value.trim();const msg="
          new="const userMsg=document.getElementById('appMessage').value.trim();const file=document.getElementById('appAttachment').files[0];let attachmentPath=null,attachmentName=null,attachmentType=null;if(file){if(file.size>10*1024*1024)throw new Error('Anlage ist größer als 10 MB');const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/jpeg','image/png'];if(!allowed.includes(file.type))throw new Error('Dateityp nicht erlaubt');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');attachmentPath=crypto.randomUUID()+'/'+safe;const {error:uploadError}=await websiteSupabase.storage.from('website-applications').upload(attachmentPath,file,{contentType:file.type,upsert:false});if(uploadError)throw uploadError;attachmentName=file.name;attachmentType=file.type;}const msg="
          if old not in s: raise SystemExit('JS marker missing')
          s=s.replace(old,new,1)
          old2='hours:null,experience:null,message:msg});'
          new2='hours:null,experience:null,message:msg,attachment_path:attachmentPath,attachment_name:attachmentName,attachment_type:attachmentType});'
          if old2 not in s: raise SystemExit('Insert marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bewerbungsanlagen ermöglichen und PDL-Bezeichnung entfernen"
          git push
