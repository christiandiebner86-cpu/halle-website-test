name: Fix mobile application upload

on:
  push:
    paths:
      - '.github/workflows/fix-mobile-upload.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile attachment handling more tolerant
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"', 'accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,image/jpeg,image/png"')

          old = "const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/jpeg','image/png'];if(!allowed.includes(file.type))throw new Error('Dateityp nicht erlaubt');const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');attachmentPath=crypto.randomUUID()+'/'+safe;const {error:uploadError}=await websiteSupabase.storage.from('website-applications').upload(attachmentPath,file,{contentType:file.type,upsert:false});"
          new = "const ext=(file.name.split('.').pop()||'').toLowerCase();const typeByExt={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png'};const allowed=['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/jpeg','image/jpg','image/pjpeg','image/png'];let normalizedType=file.type||typeByExt[ext]||'';if((normalizedType==='image/jpg'||normalizedType==='image/pjpeg')&&(ext==='jpg'||ext==='jpeg'))normalizedType='image/jpeg';if(!allowed.includes(file.type)&&!typeByExt[ext])throw new Error('Dateityp nicht unterstützt. Bitte PDF, Word, JPG oder PNG verwenden.');if(!['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document','image/jpeg','image/png'].includes(normalizedType))normalizedType=typeByExt[ext]||normalizedType;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');attachmentPath=crypto.randomUUID()+'/'+safe;const {error:uploadError}=await websiteSupabase.storage.from('website-applications').upload(attachmentPath,file,{contentType:normalizedType||'application/octet-stream',upsert:false});"
          if old not in s:
              raise SystemExit('Upload validation block not found')
          s = s.replace(old, new, 1)
          s = s.replace("attachmentType=file.type;", "attachmentType=normalizedType||file.type||typeByExt[ext]||'application/octet-stream';", 1)

          old_error = "showFormMessage('applicationMessage','Die Bewerbung konnte noch nicht gesendet werden. Bitte versuchen Sie es später erneut.','error');"
          new_error = "const msg=err&&err.message?err.message:'Unbekannter Fehler';showFormMessage('applicationMessage','Die Bewerbung konnte nicht gesendet werden: '+msg,'error');"
          if old_error not in s:
              raise SystemExit('Error message block not found')
          s = s.replace(old_error, new_error, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Make mobile attachment uploads more robust"
          git push
