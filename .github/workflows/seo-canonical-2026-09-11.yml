name: SEO Canonical
on:
  push:
    paths:
      - '.github/workflows/seo-canonical-2026-09-11.yml'
permissions:
  contents: write
jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical und Social URL ergänzen
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          canonical='<link rel="canonical" href="https://intensivpflege-halle.de/">'
          if 'rel="canonical"' not in s:
              s=s.replace('<title>Intensivpflege-Halle-GmbH</title>', '<title>Intensivpflege-Halle-GmbH</title>'+canonical+'<meta property="og:url" content="https://intensivpflege-halle.de/">', 1)
          p.write_text(s,encoding='utf-8')
      - name: Prüfen
        run: |
          grep -q 'rel="canonical" href="https://intensivpflege-halle.de/"' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'SEO: Produktionsdomain als Canonical festlegen'
          git push
