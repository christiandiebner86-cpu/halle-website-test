name: Produktionsbereinigung Website
on:
  push:
    paths:
      - '.github/workflows/production-cleanup-2026-09-11.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ABVP-Mitgliedslogo lokal speichern
        run: curl -fL --retry 3 'https://abvp.de/wp-content/uploads/ABVP-Mitglied-Logo-V2.png' -o abvp-mitglied-logo.png
      - name: Website produktionsfest machen
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s

          # Externe Alt-IONOS-Bilder entfernen. Weiterbildung nutzt ein bereits lokales Bild;
          # das ABVP-Mitgliedslogo wird direkt vom Verband lokalisiert.
          s=s.replace('https://www.intensivpflege-halle.de/s/cc_images/cache_17499313.jpg?t=1729590566','karriere-team.png')
          s=s.replace('https://www.intensivpflege-halle.de/s/cc_images/cache_16903021.png?t=1688112271','abvp-mitglied-logo.png')

          impressum='''<details class="privacy-details" id="impressum"><summary>Impressum</summary><div class="privacy-content"><div class="privacy-text">
          <h3>Angaben gemäß § 5 DDG</h3><p><strong>Intensivpflege-Halle-GmbH</strong><br>Geschäftsführerin: Steffi Zapke<br>Fritz-Reuter-Straße 42<br>06792 Sandersdorf-Brehna</p>
          <h3>Kontakt</h3><p>Telefon: +49 3493 82 38 868<br>Telefax: +49 3493 82 39 882<br>E-Mail: <a href="mailto:intensivpflegehalle&#64;gmail.com">intensivpflegehalle&#64;gmail.com</a></p>
          <h3>Handelsregister</h3><p>Registergericht: Amtsgericht Stendal<br>Registernummer: HRB 22941</p>
          <h3>Gesellschafter</h3><p>Hans Egbert Schindler</p>
          <h3>Haftpflichtversicherung</h3><p>Die Haftpflichtversicherung der Intensivpflege-Halle-GmbH wird bei der ERGO geführt. Der räumliche Geltungsbereich des Versicherungsschutzes umfasst Tätigkeiten in Deutschland.</p>
          <h3>Fotos</h3><p>Intensivpflege Halle GmbH; Bildagentur Shotshop sowie weitere auf dieser Website eingesetzte Bildmaterialien.</p>
          <h3>Online-Streitbeilegung</h3><p>Die frühere Plattform der Europäischen Kommission zur Online-Streitbeilegung (OS-Plattform) wurde zum 20. Juli 2025 eingestellt. Ein Verweis auf die nicht mehr betriebene OS-Plattform wird daher nicht mehr verwendet.</p>
          <h3>Haftung für Inhalte und Links</h3><p>Die Inhalte dieser Website werden mit Sorgfalt erstellt und regelmäßig geprüft. Für Inhalte externer Websites, auf die wir verlinken, sind ausschließlich deren Betreiber verantwortlich.</p>
          <h3>Urheberrecht</h3><p>Die Inhalte und Werke dieser Website unterliegen dem geltenden Urheberrecht. Eine Vervielfältigung oder Verwendung außerhalb der gesetzlichen Grenzen bedarf der Zustimmung des jeweiligen Rechteinhabers.</p>
          </div></div></details>'''

          datenschutz='''<details class="privacy-details" id="datenschutz"><summary>Datenschutz</summary><div class="privacy-content"><div class="privacy-text">
          <h3>1. Verantwortliche Stelle</h3><p>Intensivpflege-Halle-GmbH<br>Fritz-Reuter-Straße 42<br>06792 Sandersdorf-Brehna<br>Telefon: 03493 / 82 38 868<br>E-Mail: <a href="mailto:intensivpflegehalle&#64;gmail.com">intensivpflegehalle&#64;gmail.com</a></p>
          <h3>2. Datenschutzbeauftragter</h3><p>Egbert Schindler<br>Fritz-Reuter-Straße 42<br>06792 Sandersdorf-Brehna<br>Telefon: 03493 / 82 38 868<br>E-Mail: <a href="mailto:egbert.schindler&#64;web.de">egbert.schindler&#64;web.de</a></p>
          <h3>3. Bereitstellung der Website und Server-Logdaten</h3><p>Beim Aufruf der Website werden technisch erforderliche Verbindungsdaten verarbeitet, insbesondere IP-Adresse, Zeitpunkt des Abrufs, angeforderte Ressource, Browser- bzw. Geräteinformationen und gegebenenfalls Referrer-Daten. Die Verarbeitung dient der sicheren und stabilen Bereitstellung der Website.</p>
          <h3>4. Hosting über GitHub Pages</h3><p>Diese Website wird über GitHub Pages bereitgestellt, einen Dienst von GitHub. Bei der Auslieferung der Website können technisch notwendige Zugriffsdaten durch GitHub verarbeitet werden. Weitere Informationen finden Sie in den Datenschutzinformationen von GitHub.</p>
          <h3>5. Verschlüsselte Übertragung</h3><p>Die Website wird über HTTPS bereitgestellt. Dadurch werden Daten zwischen Ihrem Browser und der Website verschlüsselt übertragen.</p>
          <h3>6. Kontaktaufnahme</h3><p>Wenn Sie uns telefonisch oder per E-Mail kontaktieren, verarbeiten wir die von Ihnen übermittelten Angaben zur Bearbeitung Ihrer Anfrage und für erforderliche Anschlussfragen. Die Rechtsgrundlage richtet sich nach dem Inhalt Ihrer Anfrage, insbesondere Art. 6 Abs. 1 lit. b oder lit. f DSGVO.</p>
          <h3>7. Kurzbewerbung</h3><p>Über die Kurzbewerbung können Sie freiwillig Bewerbungsdaten übermitteln, insbesondere Name, Telefonnummer, Qualifikation, gewünschter Einsatzbereich, Arbeitsplatzwunsch und Nachricht. Die Angaben werden ausschließlich zur Bearbeitung Ihrer Bewerbung und zur Kontaktaufnahme im Bewerbungsverfahren verwendet. Rechtsgrundlage ist insbesondere § 26 BDSG in Verbindung mit Art. 6 DSGVO.</p>
          <h3>8. Supabase</h3><p>Für die technische Verarbeitung und Speicherung der über das Bewerbungsformular übermittelten Angaben wird Supabase eingesetzt. Dabei werden die für die Formularfunktion erforderlichen Daten an die konfigurierte Supabase-Infrastruktur übertragen. Bewerbungsdaten werden nur so lange gespeichert, wie dies für das Bewerbungsverfahren und gegebenenfalls gesetzliche Aufbewahrungspflichten erforderlich ist.</p>
          <h3>9. jsDelivr</h3><p>Zur Bereitstellung der Supabase-JavaScript-Bibliothek wird das Content Delivery Network jsDelivr eingebunden. Beim Abruf können technisch notwendige Verbindungsdaten, insbesondere die IP-Adresse, an den CDN-Anbieter übertragen werden.</p>
          <h3>10. Cookies und Einwilligung</h3><p>Die derzeitige Website setzt für ihre eigenen Grundfunktionen keine Analyse- oder Marketing-Cookies ein. Sollten künftig einwilligungspflichtige Dienste eingesetzt werden, werden diese erst nach einer entsprechenden Einwilligung aktiviert.</p>
          <h3>11. Facebook / Meta</h3><p>Links zu Facebook oder anderen externen Social-Media-Angeboten führen lediglich auf die jeweilige externe Plattform. Durch einen normalen Link wird auf dieser Website kein Facebook-Login und kein Meta-Pixel ausgeführt. Sollten künftig Facebook Login, Meta Pixel, Custom Audiences oder vergleichbare Meta Business Tools eingebunden werden, erfolgt eine Aktivierung einwilligungspflichtiger Funktionen erst nach entsprechender Einwilligung.</p>
          <h3>12. Externe Links</h3><p>Beim Aufruf externer Links verlassen Sie unsere Website. Für die anschließende Datenverarbeitung gelten die Datenschutzbestimmungen des jeweiligen Anbieters.</p>
          <h3>13. Keine automatisierte Entscheidung</h3><p>Auf dieser Website findet keine ausschließlich automatisierte Entscheidungsfindung einschließlich Profiling im Sinne von Art. 22 DSGVO statt.</p>
          <h3>14. Ihre Rechte</h3><p>Sie haben im Rahmen der gesetzlichen Voraussetzungen insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch. Erteilte Einwilligungen können mit Wirkung für die Zukunft widerrufen werden.</p>
          <h3>15. Beschwerderecht</h3><p>Sie haben das Recht, sich bei einer Datenschutz-Aufsichtsbehörde über die Verarbeitung Ihrer personenbezogenen Daten zu beschweren.</p>
          <h3>16. Widerspruch gegen Werbe-E-Mails</h3><p>Der Nutzung veröffentlichter Kontaktdaten zur Übersendung nicht ausdrücklich angeforderter Werbung wird widersprochen.</p>
          <h3>17. Aktualität</h3><p>Diese Datenschutzerklärung wird angepasst, wenn sich Funktionen, eingesetzte Dienste oder rechtliche Anforderungen ändern. Stand: September 2026.</p>
          <div class="privacy-note">Hinweis: Diese Datenschutzerklärung beschreibt die aktuell technisch eingesetzten Website-Funktionen. Eine individuelle rechtliche Prüfung, insbesondere der Auftragsverarbeitung und der konkreten Löschfristen, wird empfohlen.</div>
          </div></div></details>'''

          def replace_details(text, title, replacement):
              pattern=rf'<details[^>]*>\s*<summary>\s*{title}\s*</summary>.*?</details>'
              out,n=re.subn(pattern,replacement,text,count=1,flags=re.S|re.I)
              if n != 1:
                  raise SystemExit(f'{title}: erwarteten Bereich nicht eindeutig gefunden (Treffer {n})')
              return out

          s=replace_details(s,'Impressum',impressum)
          s=replace_details(s,'Datenschutz',datenschutz)
          if s == old:
              raise SystemExit('Keine Änderungen erzeugt')
          p.write_text(s,encoding='utf-8')
      - name: Prüfen, dass keine alten Bild-Hotlinks übrig sind
        run: |
          ! grep -F 'www.intensivpflege-halle.de/s/cc_images/' index.html
          test -s abvp-mitglied-logo.png
          grep -q 'Hosting über GitHub Pages' index.html
          grep -q 'Stand: September 2026' index.html
      - name: Änderungen committen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html abvp-mitglied-logo.png
          git commit -m 'Produktionsbilder lokalisieren und Rechtstexte aktualisieren'
          git push
