name: Merge care CTA branch
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --repo ${{ github.repository }} --base main --head care-cta-update --title "Improve care consultation button readability" --body "Improves contrast and readability of the care consultation button in Halle brand colors." || true
          gh pr merge care-cta-update --repo ${{ github.repository }} --merge --admin || gh pr merge care-cta-update --repo ${{ github.repository }} --merge
