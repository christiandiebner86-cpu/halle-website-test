name: Add fax to header
on:
  push:
    paths:
      - '.github/workflows/add-fax.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add fax number next to phone
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<a class="phone" href="tel:+4934938238868">☎ 03493 82 38 868</a>'
          new='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><a class="phone" href="tel:+4934938238868">☎ 03493 82 38 868</a><span style="font-size:14px;font-weight:800;color:#5f7482;white-space:nowrap">Fax 03493 82 39 882</span></div>'
          if old not in s:
              raise SystemExit('Telefon-Link nicht gefunden; keine Änderung vorgenommen.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Faxnummer im Website-Header ergänzen"
          git push
