name: Add mobile contact number
on:
  push:
    paths: ['.github/workflows/add-mobile-contact.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old='<div class="contact"><small>Telefon</small><strong>03493 82 38 868</strong><a href="tel:+4934938238868">Jetzt anrufen →</a></div>'
          new='<div class="contact"><small>Telefon</small><strong>03493 82 38 868</strong><a href="tel:+4934938238868">Festnetz anrufen →</a><strong style="margin-top:14px">0177 5969655</strong><a href="tel:+491775969655">Handy anrufen →</a></div>'
          if old not in s: raise SystemExit('Telefon-Kontaktblock nicht gefunden')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Handynummer im Kontaktbereich ergänzen"
          git push
