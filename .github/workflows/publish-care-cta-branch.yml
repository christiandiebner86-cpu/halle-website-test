name: Publish care CTA branch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CTA and publish branch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          pat=r'(<a\b[^>]*)(>\s*Unverbindlich zur Versorgung beraten lassen\s*(?:→|&rarr;|&#8594;)?\s*</a>)'
          def repl(m):
              start=m.group(1)
              if 'style=' in start:
                  start=re.sub(r'style=("|\')(.*?)(\1)',lambda x:f'style={x.group(1)}{x.group(2)};color:#fff!important;font-weight:950;text-shadow:0 1px 1px rgba(0,0,0,.18);background:linear-gradient(135deg,#3f931d,#71bf2b);border:1px solid #3f931d;box-shadow:0 8px 20px rgba(63,147,29,.22);{x.group(1)}',start,count=1)
              else:
                  start+=' style="color:#fff!important;font-weight:950;text-shadow:0 1px 1px rgba(0,0,0,.18);background:linear-gradient(135deg,#3f931d,#71bf2b);border:1px solid #3f931d;box-shadow:0 8px 20px rgba(63,147,29,.22);"'
              return start+m.group(2)
          ns,n=re.subn(pat,repl,s,count=1,flags=re.I|re.S)
          if n==0: raise SystemExit('CTA text not found')
          p.write_text(ns)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Improve care consultation button readability" || true
          git push origin HEAD:care-cta-update --force
