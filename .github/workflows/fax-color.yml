name: Match fax color to phone
on:
  push:
    paths:
      - '.github/workflows/fax-color.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match fax color
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<span style="font-size:14px;font-weight:800;color:#5f7482;white-space:nowrap">Fax 03493 82 39 882</span>'
          new='<span style="font-size:14px;font-weight:800;color:var(--green-dark);white-space:nowrap">Fax 03493 82 39 882</span>'
          if old not in s:
              raise SystemExit('Fax-Zeile nicht gefunden; keine Änderung vorgenommen.')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Faxnummer farblich an Telefonnummer anpassen"
          git push
